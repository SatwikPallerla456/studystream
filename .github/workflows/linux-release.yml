name: Linux installer
on:
  push:
    branches: [codex/studystream-reliability]
    paths: ['.github/workflows/linux-release.yml', 'scripts/package-linux.sh', 'lib/**', 'packages/**', 'linux/**', 'pubspec.*']
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: '1.0.0-preview.1'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y jq git curl ca-certificates unzip xz-utils clang cmake ninja-build pkg-config g++ libgtk-3-dev liblzma-dev libsecret-1-dev libnotify-dev libayatana-appindicator3-dev libvlc-dev vlc-plugin-base libmpv-dev libepoxy-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev libwayland-dev
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build release
        run: flutter build linux --release
      - name: Package installer
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.0.0-preview.1' }}
        run: bash scripts/package-linux.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Tangerine-linux-x64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
