name: Fedora installer
on:
  push:
    branches: [codex/studystream-reliability]
    paths: ['.github/workflows/fedora-release.yml', 'scripts/package-fedora.sh', 'lib/**', 'packages/**', 'linux/**', 'pubspec.*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install native build dependencies
        run: |
          dnf install -y which git curl ca-certificates unzip xz jq clang cmake ninja-build pkgconf-pkg-config gcc-c++ gtk3-devel xz-devel libsecret-devel libnotify-devel libayatana-appindicator-gtk3-devel vlc-devel mpv-devel libepoxy-devel wayland-devel rpm-build
          curl -fL https://copr.fedorainfracloud.org/coprs/philn/wpewebkit/repo/fedora-44/philn-wpewebkit-fedora-44.repo -o /etc/yum.repos.d/wpewebkit.repo
          dnf install -y 'pkgconfig(wpe-webkit-2.0)' 'pkgconfig(wpe-1.0)'
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Package RPM
        run: bash scripts/package-fedora.sh 1.0.0-preview.1
      - uses: actions/upload-artifact@v4
        with:
          name: Tangerine-fedora44-x64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14
